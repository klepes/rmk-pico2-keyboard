# Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "pico2"
product_name = "pico2"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "rp2350"

[matrix]
# Row and col pins are mandatory
row_pins = ["GPIO18"]
col_pins = ["GPIO19", "GPIO20", "GPIO21"]

# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 1
cols = 3
layers = 1
keymap = [
    [
        ["S", "A", "C"]
    ]
]
